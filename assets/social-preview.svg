<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Requirements Quality Agent</title>
  <desc id="description">Evidence-linked review, deterministic controls, and human approval.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#132A46"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="110" r="220" fill="#38BDF8" opacity="0.08"/>
  <circle cx="1020" cy="600" r="300" fill="#2DD4BF" opacity="0.08"/>

  <g transform="translate(72 72)">
    <rect width="58" height="58" rx="16" fill="url(#accent)"/>
    <path d="M17 30l8 8 17-20" fill="none" stroke="#082F49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="21" fill="#99F6E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PUBLIC AI CASE STUDY</text>
  </g>

  <text x="72" y="220" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="62" font-weight="700">Requirements</text>
  <text x="72" y="292" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="62" font-weight="700">Quality Agent</text>
  <rect x="72" y="322" width="420" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="372" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">Evidence-linked review. Deterministic controls.</text>
  <text x="72" y="408" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">Human approval.</text>

  <g transform="translate(72 460)" font-family="DejaVu Sans, Arial, sans-serif">
    <g>
      <rect width="154" height="94" rx="18" fill="#FFFFFF" opacity="0.10"/>
      <text x="20" y="42" fill="#F8FAFC" font-size="34" font-weight="700">50</text>
      <text x="20" y="70" fill="#A7F3D0" font-size="16">source items</text>
    </g>
    <g transform="translate(174 0)">
      <rect width="184" height="94" rx="18" fill="#FFFFFF" opacity="0.10"/>
      <text x="20" y="42" fill="#F8FAFC" font-size="34" font-weight="700">43</text>
      <text x="20" y="70" fill="#A7F3D0" font-size="16">verified findings</text>
    </g>
    <g transform="translate(378 0)">
      <rect width="188" height="94" rx="18" fill="#FFFFFF" opacity="0.10"/>
      <text x="20" y="42" fill="#F8FAFC" font-size="26" font-weight="700">HUMAN</text>
      <text x="20" y="70" fill="#A7F3D0" font-size="16">makes the decision</text>
    </g>
  </g>

  <g transform="translate(760 112)" filter="url(#shadow)" font-family="DejaVu Sans, Arial, sans-serif">
    <rect width="440" height="412" rx="28" fill="#F8FAFC"/>
    <text x="34" y="54" fill="#0F172A" font-size="22" font-weight="700">Evidence-linked review</text>
    <text x="34" y="84" fill="#64748B" font-size="15">One controlled path from sources to decision</text>

    <g transform="translate(34 118)">
      <rect width="372" height="66" rx="14" fill="#E0F2FE"/>
      <circle cx="34" cy="33" r="16" fill="#0EA5E9"/>
      <text x="34" y="39" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">1</text>
      <text x="66" y="29" fill="#0F172A" font-size="17" font-weight="700">Validate the source pack</text>
      <text x="66" y="50" fill="#475569" font-size="13">IDs, files, versions and SHA-256</text>
    </g>
    <path d="M220 184v22" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(34 206)">
      <rect width="372" height="66" rx="14" fill="#CCFBF1"/>
      <circle cx="34" cy="33" r="16" fill="#0F766E"/>
      <text x="34" y="39" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">2</text>
      <text x="66" y="29" fill="#0F172A" font-size="17" font-weight="700">Verify candidate findings</text>
      <text x="66" y="50" fill="#475569" font-size="13">Typed schema and exact source quotes</text>
    </g>
    <path d="M220 272v22" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(34 294)">
      <rect width="372" height="78" rx="14" fill="#EDE9FE"/>
      <circle cx="34" cy="39" r="16" fill="#7C3AED"/>
      <path d="M26 39l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="32" fill="#0F172A" font-size="17" font-weight="700">Pause for a person</text>
      <text x="66" y="54" fill="#475569" font-size="13">Approve, edit, reject or request revision</text>
    </g>
  </g>

  <text x="1200" y="590" text-anchor="end" fill="#A7F3D0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">Mounir Dameur · Public AI portfolio</text>
</svg>
